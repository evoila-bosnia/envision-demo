apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  labels: { app: otel-lgtm }
spec:
  replicas: 1
  strategy: { type: Recreate }   # single RWO PVC
  selector:
    matchLabels: { app: otel-lgtm }
  template:
    metadata:
      labels: { app: otel-lgtm }
    spec:
      # NOTE (PodSecurity): grafana/otel-lgtm has NO USER in its Dockerfile and
      # writes to the in-image /otel-lgtm tree (root-owned) as well as /data, so it
      # runs as root and CANNOT satisfy the 'restricted' runAsNonRoot rule without a
      # non-root LGTM image. We apply the baseline-compatible hardening that does not
      # require non-root (no privilege escalation, drop all capabilities, seccomp
      # RuntimeDefault) and keep fsGroup for the /data PVC. This pod needs the
      # namespace at 'baseline' (see PR body: observability layer is the blocker).
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-lgtm
          image: grafana/otel-lgtm:0.33.1   # pinned (release v0.33.1). VERIFY tag at apply.
          imagePullPolicy: IfNotPresent
          env:
            # Grafana admin credentials come from the out-of-band Secret
            # 'grafana-admin' in this namespace (created governed from a Vault
            # ref by the operator; see README). optional: false fails closed —
            # the pod will not start until the Secret exists.
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: GF_SECURITY_ADMIN_USER
                  optional: false
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: GF_SECURITY_ADMIN_PASSWORD
                  optional: false
          ports:
            - { name: grafana,   containerPort: 3000, protocol: TCP }
            - { name: otlp-grpc, containerPort: 4317, protocol: TCP }
            - { name: otlp-http, containerPort: 4318, protocol: TCP }
          readinessProbe:
            httpGet: { path: /api/health, port: grafana }
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data     # LGTM persists prom/loki/tempo under /data; verify at apply
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits:   { cpu: "2",  memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otel-lgtm-data
