apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envision-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/evoila-bosnia/envision-demo.git
    targetRevision: main
    path: argocd            # app-of-apps: everything under argocd/ (except itself)
    directory:
      recurse: false
      exclude: "app-root.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ CreateNamespace=true ]
