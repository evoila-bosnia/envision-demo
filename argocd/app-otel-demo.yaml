# OpenTelemetry Demo — REDUCED. The chart bundles its own grafana/prometheus/
# jaeger/opensearch; we DISABLE all four (the LGTM all-in-one replaces them) and
# point the demo's OpenTelemetry Collector at otel-lgtm's OTLP endpoint. ArgoCD
# renders the Helm chart in-cluster (no client-side helm needed here — that
# accepted deviation applies only to installing ArgoCD itself).
#
# !! VERIFY the opentelemetry-collector.config override against chart
#    opentelemetry-demo-0.42.0's DEFAULT collector config before first sync:
#    the default defines exporters (otlp/jaeger, otlphttp/prometheus, opensearch)
#    and references them in pipelines. Replacing the per-pipeline `exporters`
#    lists with [otlp/lgtm] drops the removed backends (unreferenced exporters
#    are never instantiated, so leaving them defined is harmless).
#
# PodSecurity 'restricted': the values below add restricted-profile securityContext
# to every enabled demo component (see PR fix/psa-restricted-compliance). The chart
# renders `default.securityContext` at container level and `default.podSecurityContext`
# at pod level for any component that does not set its own; components with their own
# block are deep-merged (Helm values merge) with the three missing restricted fields.
# Root-by-default images are pinned to a non-root uid (accounting is pinned to
# its image's own non-root uid 1654); the seven busybox initContainers
# are re-declared with a securityContext because the chart renders initContainers
# verbatim.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-demo
    targetRevision: 0.42.0          # chart 0.42.0 -> appVersion 3.1.0 (pinned)
    helm:
      releaseName: otel-demo
      values: |
        # --- drop the demo's bundled observability stack (LGTM replaces it) ---
        jaeger:     { enabled: false }
        prometheus: { enabled: false }
        grafana:    { enabled: false }
        opensearch: { enabled: false }
        otel-ebpf-profiler: { enabled: false }
        # --- route the demo collector to the LGTM all-in-one OTLP sink ---
        opentelemetry-collector:
          enabled: true
          # Run the bundled collector as a Deployment, not the chart's default
          # DaemonSet. In daemonset mode the chart renders it as
          # `otel-collector-agent` with hostPort receivers and a hostPath
          # (`/hostfs`, from the hostMetrics preset) — both are rejected by the
          # namespace's PodSecurity `baseline` enforcement, so the pod is never
          # admitted and the Application hangs `Progressing`. A single-replica
          # Deployment is a gateway collector that needs no host access: the
          # demo microservices push OTLP to it over the cluster network.
          mode: deployment
          replicaCount: 1
          # Disable the host-bound presets. hostMetrics mounts the node root at
          # /hostfs (breaks baseline); kubeletMetrics scrapes each node's kubelet
          # and only makes sense per-node (daemonset). kubernetesAttributes and
          # clusterMetrics stay on: both talk only to the Kubernetes API (via the
          # chart's ServiceAccount + ClusterRole), need no host access, and keep
          # cluster-level telemetry flowing to LGTM.
          # Replace the pod instead of surging a second one. With replicaCount 1
          # the default RollingUpdate (25% surge, 0 unavailable) must schedule the
          # new pod next to the old one, which a memory-tight demo cluster cannot
          # always do: the rollout then hangs at ProgressDeadlineExceeded. The
          # collector is a stateless gateway, so a few seconds of restart is fine.
          rollout:
            strategy: Recreate
          presets:
            hostMetrics:   { enabled: false }
            kubeletMetrics: { enabled: false }
          # PodSecurity `restricted` securityContext for the collector pod. The
          # chart leaves these empty by default; the demo's sibling PSA PR
          # (fix/psa-restricted-compliance) hardens every other component but
          # could not cover this subchart while it was a hostPath/hostPort
          # DaemonSet. With host access removed above, the collector is now
          # restricted-able, so it carries the same four container fields.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          # The Service the demo components dial (OTEL_COLLECTOR_NAME) stays
          # `otel-collector` in either mode (fullnameOverride, above the chart's
          # `-agent` workload suffix), so no other component config changes.
          config:
            exporters:
              otlp/lgtm:
                endpoint: otel-lgtm.envision-demo.svc.cluster.local:4317
                tls: { insecure: true }
            # The chart's default collector config declares a `span_metrics`
            # connector: the traces pipeline exports spans INTO it and the metrics
            # pipeline receives derived RED metrics back OUT of it. A connector must
            # sit on both a producing (exporter) and a consuming (receiver) pipeline
            # or the collector refuses to build. Overriding only each pipeline's
            # `exporters` below dropped span_metrics from the traces exporters
            # (Helm REPLACES list values, it does not merge them), while the chart
            # default kept span_metrics in the metrics `receivers` -- leaving the
            # connector with a consumer but no producer. The collector then
            # CrashLoops:
            #   failed to build pipelines: connector "span_metrics" used as
            #   receiver in [metrics] pipeline but not used in any supported
            #   exporter pipeline
            # Re-declare the connector and pin both of its wiring ends here, under
            # one consistent name (`span_metrics`), so the derived span metrics are
            # produced again and still reach LGTM via the metrics pipeline.
            connectors:
              span_metrics: {}
            service:
              pipelines:
                # span_metrics joins otlp/lgtm as a traces exporter: LGTM stores the
                # spans, the connector converts them into metrics.
                traces:
                  exporters: [otlp/lgtm, span_metrics]
                # span_metrics stays a metrics receiver (chart default); the other
                # default receivers are kept so all metrics still flow to LGTM.
                metrics:
                  receivers: [otlp, kafkametrics, span_metrics, prometheus/ad]
                  exporters: [otlp/lgtm]
                logs:
                  exporters: [otlp/lgtm]
        # --- PodSecurity 'restricted' defaults applied to every component that has
        #     no per-component override below (image-provider, fraud-detection, and
        #     the componentised main containers inherit these) ---
        default:
          securityContext:                 # container-level
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          podSecurityContext:              # pod-level (init/sidecar containers inherit)
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        # NOTE: chart 0.42.0 has no rollout-strategy key for the demo components
        # (its Deployment template renders only replicas/revisionHistoryLimit), so
        # they keep the Kubernetes default RollingUpdate (surge 1 at 1 replica);
        # only the collector subchart's `rollout` above is configurable here.
        components:
          # === expose the demo UI on a Foundation LB VIP + harden envoy (uid 101) ===
          frontend-proxy:
            service:
              type: LoadBalancer
            securityContext:               # deep-merges with chart's runAsUser 101 (envoy)
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }
          # === chart already pins a non-root uid; add the 3 missing restricted fields ===
          frontend:
            securityContext:               # chart runAsUser 1001 (nextjs)
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }
          payment:
            securityContext:               # chart runAsUser 1000
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }
          quote:
            securityContext:               # chart runAsUser 33 (www-data)
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }
          kafka:
            securityContext:               # chart runAsUser 1000 (appuser)
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }
          valkey-cart:
            securityContext:               # chart runAsUser 999
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }
          telemetry-docs:
            securityContext:               # chart runAsUser 101
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }
          # === non-root image (65532) + readOnlyRootFilesystem + tmp emptyDir + init ===
          checkout:
            securityContext:               # deep-merges with chart readOnlyRootFilesystem
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              seccompProfile: { type: RuntimeDefault }
            podSecurityContext:            # fsGroup so the 65532 user can write the tmp emptyDir
              runAsNonRoot: true
              fsGroup: 65532
              seccompProfile: { type: RuntimeDefault }
            initContainers:
              - name: wait-for-kafka
                image: busybox:latest
                command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }
                  runAsNonRoot: true
                  runAsUser: 65534
                  seccompProfile: { type: RuntimeDefault }
          product-catalog:
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              seccompProfile: { type: RuntimeDefault }
            podSecurityContext:
              runAsNonRoot: true
              fsGroup: 65532
              seccompProfile: { type: RuntimeDefault }
            initContainers:
              - name: wait-for-astronomy-db
                image: busybox:latest
                command: ["sh", "-c", "until nc -z -v -w30 astronomy-db 5432; do echo waiting for astronomy-db; sleep 2; done;"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }
                  runAsNonRoot: true
                  runAsUser: 65534
                  seccompProfile: { type: RuntimeDefault }
          shipping:
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              seccompProfile: { type: RuntimeDefault }
            podSecurityContext:
              runAsNonRoot: true
              fsGroup: 65532
              seccompProfile: { type: RuntimeDefault }
            initContainers:
              - name: wait-for-flagd
                image: busybox:latest
                command: ["sh", "-c", "until nc -z -v -w30 flagd 8013; do echo waiting for flagd; sleep 2; done;"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }
                  runAsNonRoot: true
                  runAsUser: 65534
                  seccompProfile: { type: RuntimeDefault }
          # === non-root image (65532) with a busybox init (main inherits default sc) ===
          fraud-detection:
            initContainers:
              - name: wait-for-kafka
                image: busybox:latest
                command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }
                  runAsNonRoot: true
                  runAsUser: 65534
                  seccompProfile: { type: RuntimeDefault }
          # === accounting (.NET): the image is NOT root-by-default. Its Dockerfile
          #     ends `USER app` (uid/gid 1654, from the dotnet/aspnet base) and its
          #     entrypoint /app/instrument.sh is mode 0744 owned by app, so only
          #     uid 1654 may execute it. Pinning 65534 made runc fail with
          #     `exec: "./instrument.sh": permission denied` before any output
          #     (CrashLoopBackOff, empty logs). Pin the image's own uid; it has to
          #     be numeric because `app` is a name and runAsNonRoot cannot verify
          #     a non-numeric image USER. ===
          accounting:
            podSecurityContext:
              runAsNonRoot: true
              runAsUser: 1654
              runAsGroup: 1654
              seccompProfile: { type: RuntimeDefault }
            initContainers:
              - name: wait-for-kafka
                image: busybox:latest
                command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }
                  runAsNonRoot: true
                  runAsUser: 65534
                  seccompProfile: { type: RuntimeDefault }
          # === root-by-default image + busybox init: pin a non-root uid pod-wide ===
          cart:
            podSecurityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              seccompProfile: { type: RuntimeDefault }
            initContainers:
              - name: wait-for-valkey-cart
                image: busybox:latest
                command: ["sh", "-c", "until nc -z -v -w30 valkey-cart 6379; do echo waiting for valkey-cart; sleep 2; done;"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }
                  runAsNonRoot: true
                  runAsUser: 65534
                  seccompProfile: { type: RuntimeDefault }
          # === root-by-default images (no init): pin a non-root uid pod-wide ===
          ad:          { podSecurityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } } }
          agent:       { podSecurityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } } }
          chatbot:     { podSecurityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } } }
          currency:    { podSecurityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } } }
          email:       { podSecurityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } } }
          mcp:         { podSecurityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } } }
          recommendation: { podSecurityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } } }
          opamp-server:   { podSecurityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } } }
          # load-generator (locust, root image): pinned non-root; SMOKE-TEST — locust
          # must be able to read its scenario files as uid 65534 (see PR body).
          load-generator: { podSecurityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } } }
          # === flagd: main (65532) + flagd-ui sidecar (root) + busybox init-config +
          #     config-rw emptyDir shared by all three -> pin uid + fsGroup pod-wide ===
          flagd:
            podSecurityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              fsGroup: 65534
              seccompProfile: { type: RuntimeDefault }
            initContainers:
              - name: init-config
                image: busybox
                command: ["sh", "-c", "cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json && cat /config-rw/demo.flagd.json"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities: { drop: ["ALL"] }
                  runAsNonRoot: true
                  runAsUser: 65534
                  seccompProfile: { type: RuntimeDefault }
                volumeMounts:
                  - mountPath: /config-ro
                    name: config-ro
                  - mountPath: /config-rw
                    name: config-rw
          # === astronomy-db (postgres 18, root-by-default): run as the postgres uid
          #     999 with a matching fsGroup so PGDATA (emptyDir) is writable.
          #     SMOKE-TEST — the postgres entrypoint expects either root or a writable
          #     PGDATA; verify initdb succeeds non-root before flipping to restricted
          #     (see PR body — candidate baseline component). ===
          astronomy-db:
            podSecurityContext:
              runAsNonRoot: true
              runAsUser: 999
              runAsGroup: 999
              fsGroup: 999
              seccompProfile: { type: RuntimeDefault }
  destination:
    server: https://kubernetes.default.svc
    namespace: envision-demo
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ CreateNamespace=true ]
