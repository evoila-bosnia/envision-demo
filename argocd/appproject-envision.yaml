# OPTIONAL. #2936 says "project default", so the Application CRs below use
# project: default. Apply this only if you want a scoped project instead;
# then flip spec.project on each Application from 'default' to 'envision'.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: envision
  namespace: argocd
spec:
  description: Envision 2026 stand demo apps
  sourceRepos:
    - "https://github.com/evoila-bosnia/envision-demo.git"
    - "https://open-telemetry.github.io/opentelemetry-helm-charts"
  destinations:
    - { server: "https://kubernetes.default.svc", namespace: envision-demo }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
